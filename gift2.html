<!DOCTYPE html>
<html lang="en">
<head>
    <title>Convert to Moodle Gift format</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        p {
            line-height: 1.6;
        }
        .explanation-text {
            font-size: 0.8em;
            color: #777;
        }
    </style>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</head>

<body>
    
    <div class="container mt-4">
        <h2>Convert to Moodle Gift format</h2>
        <div class="row mb-3">
            <div class="col-auto">
                <label for="categoryInput" class="col-form-label">Category:</label>
            </div>
            <div class="col">
                <div class="row">
                    <div class="col-sm-4 mb-2">
                        <input type="text" class="form-control form-control-sm category-input">
                        <div class="explanation-text">eg. Vocabulary 6</div>
                    </div>
                    <div class="col-sm-4 mb-2">
                        <input type="text" class="form-control form-control-sm category-input">
                        <div class="explanation-text">eg. Feeling Good</div>
                    </div>
                    <div class="col-sm-4 mb-2">
                        <input type="text" class="form-control form-control-sm category-input">
                        <div class="explanation-text">eg. EX3 Body&Health_Definition (MC)</div>
                    </div>
                </div>
            </div>
        </div>
        <div class="row mb-3">
            <div class="col-auto">
                <label for="questionNameInput" class="col-form-label">Question Name:</label>
            </div>
            <div class="col-3">
                <input type="text" id="questionNameInput" class="form-control form-control-sm" value="">
                <div class="explanation-text">eg. 6th_Voc_EX3</div>
            </div>
        </div>

        <div class="row mb-3">
            <div class="col-auto">
                <label for="tagsInput" class="col-form-label">Tags:</label>
            </div>
            <div class="col">
                <div class="row">
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input">
                        <div class="explanation-text">eg. 6th</div>
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input">
                        <div class="explanation-text">eg. definitions</div>
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input">
                        <div class="explanation-text">eg. 6th_voc_Ex3</div>
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input">
                        <div class="explanation-text">eg. MC</div>
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input">
                        <div class="explanation-text">eg. Feeling Good</div>
                    </div>
                     <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input">
                        <div class="explanation-text">eg. Body & Health</div>
                    </div>
                </div>
            </div>
        </div>

        <div class="mb-3">
            <label for="richTextInput" class="form-label">Input:</label>
            <textarea id="richTextInput" class="form-control" rows="15"></textarea>
        </div>
        <button id="proceedButton" class="btn btn-primary">Proceed</button>
        
        <div class="mb-3 mt-4">
            <label for="resultDisplay" class="form-label">Result:</label>
            <textarea id="resultDisplay" class="form-control" rows="10" readonly></textarea>
        </div>
    </div>
    <script>
        document.getElementById('proceedButton').addEventListener('click', function() {
            const questionName = document.getElementById('questionNameInput').value.trim();
            const inputText = document.getElementById('richTextInput').value;
            const questions = inputText.split(/\n(?=\d+\.)/);
            const tagInputs = document.querySelectorAll('.tag-input');
            const tags = Array.from(tagInputs).map(input => input.value).filter(tag => tag);
            const categoryInputs = document.querySelectorAll('.category-input');
            const categories = Array.from(categoryInputs).map(input => input.value).filter(category => category);
    
            let giftText = "";
            let questionNumber = 1;
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const dateTimeString = `${year}-${month}-${day}`;
    
            let categoryString = "$CATEGORY: $course$/top/";
            if (categories.length > 0) {
                categoryString += categories.join('/') + ' ' + dateTimeString + '\n\n';
            } else {
                categoryString += dateTimeString + '\n\n';
            }
            giftText += categoryString;
    
            questions.forEach(question => {
                const lines = question.split('\n');
                let questionLine = lines[0].trim();
                questionLine = questionLine.replace(/^\d+\.?\s*/, '');
                const options = lines.slice(1).map(line => {
                    let option = line.trim();
                    option = option.replace(/^(?:[^\d\w]\s*|\w+\.\s*)/, '');
                    return option;
                }).filter(line => line);
                
                function shuffleArray(array) {
                    for (let i = array.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [array[i], array[j]] = [array[j], array[i]];
                    }
                    return array;
                }
    
                const shuffledOptions = shuffleArray([...options]);
                const formattedQuestionNumber = String(questionNumber).padStart(2, '0');
                const correctAnswer = options[0];
    
                if (tags.length > 0) {
                    giftText += "// " + tags.map(tag => `[tag:${tag}]`).join(" ") + "\n";
                }
    
                giftText += `::${questionName}_Q${formattedQuestionNumber}[${correctAnswer}]::<p class\\="q_stem">${questionLine}</p> {\n`;
                shuffledOptions.forEach(option => {
                    if (option === correctAnswer) {
                        giftText += `=<p class\\="options">${option}</p>\n`;
                    } else {
                        giftText += `~<p class\\="options">${option}</p>\n`;
                    }
                });
                giftText += "}\n\n";
                questionNumber++;
            });
    
            document.getElementById('resultDisplay').value = giftText.trim();
    
            // Download as text file
            if (questionName) {
                const blob = new Blob([giftText.trim()], { type: "text/plain" });
                const link = document.createElement("a");
                link.href = URL.createObjectURL(blob);
                link.download = `${questionName}.txt`;
                document.body.appendChild(link);
                link.click();
                document.body.removeChild(link);
            } else {
                alert("Please enter a Question Name to save the file.");
            }
        });
    </script>
    
    
</body>
</html>
