<!DOCTYPE html>
<html lang="en">
<head>
    <title>Convert to Moodle Gift format</title>
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">
    
    <!-- Bootstrap 5 & FontAwesome -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>

    <style>
        body {
            font-family: 'Roboto', sans-serif;
            background-color: #f8f9fa;
        }

        .container {
            max-width: 900px;
        }

        h2 {
            color: #343a40;
            font-weight: 700;
        }

        .explanation-text {
            font-size: 0.85em;
            color: #6c757d;
        }

        .card {
            border-radius: 10px;
        }

        .btn-custom {
            background-color: #007bff;
            color: white;
            font-weight: 600;
            padding: 10px 20px;
            border-radius: 8px;
            transition: 0.3s;
        }

        .btn-custom:hover {
            background-color: #0056b3;
        }

        .icon {
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <div class="container mt-5">
        <h2><i class="fas fa-file-alt"></i> Convert to Moodle GIFT Format</h2>

        <!-- Category Input -->
        <div class="row mb-3">
            <label class="col-auto col-form-label"><i class="fas fa-folder"></i> Category:</label>
            <div class="col">
                <div class="row">
                    <div class="col-sm-4 mb-2">
                        <input type="text" class="form-control form-control-sm category-input" placeholder="Vocabulary 6">
                    </div>
                    <div class="col-sm-4 mb-2">
                        <input type="text" class="form-control form-control-sm category-input" placeholder="Feeling Good">
                    </div>
                    <div class="col-sm-4 mb-2">
                        <input type="text" class="form-control form-control-sm category-input" placeholder="EX3 Body&Health (MC)">
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Name Input -->
        <div class="row mb-3">
            <label class="col-auto col-form-label"><i class="fas fa-question-circle"></i> Question Name:</label>
            <div class="col-4">
                <input type="text" id="questionNameInput" class="form-control form-control-sm" placeholder="6th_Voc_EX3">
            </div>
        </div>

        <!-- Tags Input -->
        <div class="row mb-3">
            <label class="col-auto col-form-label"><i class="fas fa-tags"></i> Tags:</label>
            <div class="col">
                <div class="row">
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input" placeholder="6th">
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input" placeholder="definitions">
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input" placeholder="6th_voc_Ex3">
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input" placeholder="MC">
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input" placeholder="Feeling Good">
                    </div>
                    <div class="col-sm-2 mb-2">
                        <input type="text" class="form-control form-control-sm tag-input" placeholder="Body & Health">
                    </div>
                </div>
            </div>
        </div>

        <!-- Question Input and Explanation -->
        <div class="row mb-3">
            <div class="col-md-8">
                <label for="richTextInput" class="form-label"><i class="fas fa-edit"></i> Enter your questions here:</label>
                <textarea id="richTextInput" class="form-control" rows="10" placeholder="1. Question text...&#10;  i. Option 1&#10;  ii. Option 2"></textarea>
            </div>

            <div class="col-md-4">
                <div class="card p-3 bg-light">
                    <h5><i class="fas fa-info-circle"></i> Formatting Instructions</h5>
                    <p>Use **numeric numbering** for questions and **non-numeric bullets** for answer options.</p>
                    <p>Example format:</p>
                    <pre class="bg-white p-2 border rounded">
1. You are not sick.
   i. hope
   ii. tired
   iii. well
   iv. remember
                    </pre>
                </div>
            </div>
        </div>

        <!-- Proceed Button -->
        <button id="proceedButton" class="btn btn-custom"><i class="fas fa-play-circle"></i> Proceed</button>

        <!-- Output Result -->
        <div class="mb-3 mt-4">
            <label for="resultDisplay" class="form-label"><i class="fas fa-file-code"></i> Your GIFT format:</label>
            <textarea id="resultDisplay" class="form-control" rows="8" readonly></textarea>
        </div>
    </div>

    <script>
        document.getElementById('proceedButton').addEventListener('click', function () {
            let questionName = document.getElementById('questionNameInput').value.trim();
            const inputText = document.getElementById('richTextInput').value;
            const questions = inputText.split(/\n(?=\d+\.)/);
            
            let giftText = "";
            let questionNumber = 1;

            questions.forEach(question => {
                const lines = question.split('\n');
                let questionLine = lines[0].trim().replace(/^\d+\.?\s*/, '');
                const options = lines.slice(1).map(line => line.trim().replace(/^(?:[^\d\w]\s*|\w+\.\s*)/, '')).filter(line => line);
                
                // Shuffle options
                for (let i = options.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [options[i], options[j]] = [options[j], options[i]];
                }

                const correctAnswer = options[0];
                giftText += `::${questionName}_Q${questionNumber}[${correctAnswer}]::<p class="q_stem">${questionLine}</p> {\n`;
                options.forEach(option => {
                    giftText += option === correctAnswer ? `=<p class="options">${option}</p>\n` : `~<p class="options">${option}</p>\n`;
                });
                giftText += "}\n\n";
                questionNumber++;
            });

            document.getElementById('resultDisplay').value = giftText.trim();
        });
    </script>
</body>
</html>
